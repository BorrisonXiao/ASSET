[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-speech"
version = "0.1.0"
description = "Adaptive Speech Segmentation via Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "torch==2.7.1", "torchaudio==2.7.1", "transformers==5.14.1",
  "accelerate==1.14.0", "hyperpyyaml==1.2.3", "h5py>=3.10,<4",
  "huggingface-hub>=1.0,<2", "numpy>=1.26,<3", "scipy>=1.11,<2",
  "PyYAML>=6,<7", "joblib>=1.3,<2", "packaging>=23", "requests>=2.31,<3",
  "sentencepiece>=0.1.99,<1", "soundfile>=0.12,<1", "tqdm>=4.66,<5",
]

[project.urls]
Repository = "https://github.com/BorrisonXiao/ASSET"

[tool.setuptools.packages.find]
include = ["asset*", "speechbrain*"]

[tool.setuptools.package-data]
speechbrain = ["version.txt", "log-config.yaml"]
